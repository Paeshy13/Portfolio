  <title id="title">Profile portrait</title>
  <desc id="desc">A portrait of a smiling woman with braided hair and glasses against a leafy green background.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7d9e47"/>
      <stop offset="35%" stop-color="#3f6b2f"/>
      <stop offset="100%" stop-color="#1d3a1d"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" x2="1" y1="0" y2="1">
